name: Frontends
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        frontend: [frontends/01-frontend, frontends/03-frontend]
    defaults:
      run:
        working-directory: ${{ matrix.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.frontend }}/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
